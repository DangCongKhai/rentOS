name: CD

on:
  workflow_call:

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: image
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.rentos.io.vn
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/rentos-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/rentos-frontend:production

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/rentos-backend:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/rentos-backend:production

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Dokploy webhook is not set. Skipping deploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "$DOKPLOY_WEBHOOK_URL"
          echo "Finished triggering Dokploy deployment"